<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar</title>
<link rel="stylesheet" href="/marco-casa/frame/hv/hv.css?v=7">
<style>
body{display:flex;align-items:center;justify-content:center;min-height:100%}
form{box-sizing:border-box;background:var(--card);border-radius:var(--r-lg);padding:32px;width:min(90vw,380px);box-shadow:0 1px 3px rgba(0,0,0,.08)}
h1{margin:0 0 4px;font-size:30px;letter-spacing:-.02em}
p{margin:0 0 20px;color:var(--ink-2);font-size:17px}
input{box-sizing:border-box;width:100%;font:inherit;font-size:18px;padding:14px 16px;border-radius:14px;border:0;background:var(--bg);margin-bottom:12px;color:var(--ink)}
input:focus{outline:2px solid var(--orange)}
button{width:100%;font:inherit;font-size:18px;font-weight:600;padding:15px;border:0;border-radius:14px;background:var(--orange);color:#fff}
em{display:block;color:var(--red);font-style:normal;margin:0 0 12px;font-size:16px;min-height:1px}
</style>
</head><body>
<form id="f" autocomplete="on">
  <h1>Casa</h1><p>Entra una vez y el marco lo recordará.</p>
  <em id="err"></em>
  <input id="u" type="email" name="email" placeholder="Correo de la casa" autocomplete="username" required>
  <input id="c" type="password" name="password" placeholder="Contraseña" autocomplete="current-password" required>
  <button id="b">Entrar</button>
</form>
<script src="/marco-casa/frame/hv/config.js"></script>
<script src="/marco-casa/frame/shared/datos.js"></script>
<script>
(function(){
  var f=document.getElementById('f'),b=document.getElementById('b'),err=document.getElementById('err');
  var next=(location.search.match(/[?&]next=([^&]+)/)||[])[1];next=next?decodeURIComponent(next):'';
  if(next.indexOf(MC.base)!==0)next=MC.base+'frame/hv/';
  f.onsubmit=function(e){
    e.preventDefault();err.textContent='';b.disabled=true;b.textContent='Entrando…';
    MC.login(document.getElementById('u').value.trim(),document.getElementById('c').value).then(function(){location.replace(next);},
      function(x){err.textContent=/invalid/i.test(x.message)?'Correo o contraseña incorrectos':x.message;b.disabled=false;b.textContent='Entrar';});
  };
})();
</script>
</body></html>
