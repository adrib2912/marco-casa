<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagnóstico</title>
<style>body{font:15px/1.4 -apple-system,system-ui,sans-serif;margin:16px;background:#f2f2f7;color:#1d1d1f}
h1{font-size:22px}section{background:#fff;border-radius:12px;padding:10px 14px;margin:10px 0}
b{display:block}pre{white-space:pre-wrap;word-break:break-all;font-size:12px;margin:6px 0 0;color:#444}
.ok{color:#1f7a3a}.ko{color:#c62828}button{font:inherit;padding:8px 14px;border-radius:10px;border:0;background:#0a84ff;color:#fff}</style>
</head><body>
<h1>Diagnóstico del marco</h1>
<p><button id="b">Borrar memoria y volver a probar</button></p>
<div id="out"></div>
<script src="../config.js"></script>
<script src="../../shared/datos.js?v=4"></script>
<script>
(function(){
  var out=document.getElementById('out');
  function line(t,ok,txt){var s=document.createElement('section');s.innerHTML='<b class="'+(ok?'ok':'ko')+'">'+(ok?'✓ ':'✗ ')+t+'</b><pre></pre>';s.querySelector('pre').textContent=txt;out.appendChild(s);}
  function test(t,u,sum){return fetch(u).then(function(r){return r.json().then(function(d){
    if(!r.ok||d.ok===false)line(t,false,(r.status+' · '+(d.error||'')));else line(t,true,sum(d));});},function(e){line(t,false,String(e));});}
  function run(){
    out.innerHTML='';
    line('Sesión',MC.hasSession(),MC.hasSession()?'Hay sesión iniciada':'Sin sesión');
    test('Tiempo y calendario','/api/frame',function(d){return 'Tiempo: '+(d.weather?Math.round(d.weather.temp_f)+'°':'NO')+'\nEventos: '+d.calendar_events.length+
      '\nCalendarios: '+JSON.stringify(d.calendars)+'\nPrimeros: '+d.calendar_events.slice(0,3).map(function(e){return e.start.slice(0,10)+' '+e.title+' ('+e.cal+')';}).join(' | ');})
    .then(function(){return test('Luz','/api/luz',function(d){return 'Horas: '+d.hours.length+'\nActualizado: '+d.updated+'\nAhora: '+JSON.stringify(d.now);});})
    .then(function(){return test('Tareas','/api/tasks',function(d){return d.items.length+' tareas';});})
    .then(function(){return test('Compra','/api/meals/shopping',function(d){return d.items.length+' cosas';});})
    .then(function(){return test('Fotos','/api/frame/photos',function(d){return d.photos.length+' fotos';});});
  }
  document.getElementById('b').onclick=function(){['mc-cal','mc-luz','mc-tiempo','mc-aire','mc-firmas'].forEach(function(k){try{localStorage.removeItem(k);}catch(e){}});run();};
  run();
})();
</script>
</body></html>
